name: Compile and optional UI tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: 'Run tests against the external demo service'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: bash ./gradlew --no-daemon testClasses
      - name: Run external tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests
        run: bash ./gradlew --no-daemon test -Pheadless=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          if-no-files-found: ignore
          path: |
            build/reports/tests/
            build/test-results/
            build/allure-results/
